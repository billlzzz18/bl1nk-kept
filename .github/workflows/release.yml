name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-mcp:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bl1nk-kept-mcp
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bl1nk-kept-mcp.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build MCP binary
        run: cargo build --release -p kept-mcp --bin bl1nk-kept-mcp
      - name: Package MCP asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="dist/bl1nk-kept-mcp-${TARGET}${BINARY##*.}"
          [[ "$BINARY" != *.exe ]] && asset="dist/bl1nk-kept-mcp-${TARGET}"
          cp "target/release/$BINARY" "$asset"
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-*
          path: dist/mcp
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect prior release versions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists for $TAG"
            exit 1
          fi
          {
            git tag --list 'v*' | grep -Fxv "$TAG" || true
            gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxv "$TAG" || true
          } | sort -u > "$RUNNER_TEMP/existing-release-tags.txt"
          cat "$RUNNER_TEMP/existing-release-tags.txt"

      - name: Validate monotonic release contract
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release_contract.py --tag "$TAG" --existing-tags-file "$RUNNER_TEMP/existing-release-tags.txt"

      - name: Verify project quality
        run: just check

      - name: Build release source archives
        run: python3 tools/package_source.py

      - name: Publish source and MCP assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG"             "dist/bl1nk-kept-${TAG#v}-source.zip"             "dist/bl1nk-kept-${TAG#v}-source.tar.gz"             dist/mcp/*             --verify-tag             --title "$TAG"             --generate-notes
