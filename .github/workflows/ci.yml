name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - ".learnings/**"
      - "benchmarks/**"
      - "LICENSE*"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - ".learnings/**"
      - "benchmarks/**"
      - "LICENSE*"
      - ".gitignore"
      - ".gitattributes"

# Anti-waste: Cancel in-progress runs when a new commit is pushed rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: mozilla-actions/sccache-action@v0.0.6
        id: sccache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NOTE-001: setup-python ใส่ `python` ไว้หัว PATH ทั้งบน Linux และ Windows
      # จึงไม่ต้องแยก python3/python ตาม runner OS อีกต่อไป

      # sccache is best-effort: if the GHA cache backend is unreachable,
      # sccache panics at compile time.  Only enable it when the binary
      # was installed successfully by the action above.
      # Use disk cache (not GHA backend) to avoid Azure CDN outages.
      - name: Set sccache env (best-effort)
        shell: bash
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      # Fast Fail: Format & Lint first (fails in seconds if styled wrong)
      - name: Format check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Rust lint (Clippy)
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Test suite
      - name: Rust tests
        shell: bash
        run: cargo test --workspace

      # Schema & Integrity contracts
      - name: Repository contracts
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Public schema drift
        shell: bash
        run: |
          cargo run -q -p kept-core --example export_schema > /tmp/keyword-registry.schema.json
          cmp -s /tmp/keyword-registry.schema.json schema/keyword-registry.schema.json

      - name: Version contract
        shell: bash
        run: python tools/check_version_contract.py
