name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - ".learnings/**"
      - "benchmarks/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - ".learnings/**"
      - "benchmarks/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fast Fail Steps: Format & Lint
      - name: Format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Test suite
      - name: Rust tests
        run: cargo test --workspace

      # Quality & Schema checks
      - name: Repository contracts
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Public schema drift
        run: cargo run -q -p kept-core --example export_schema > /tmp/keyword-registry.schema.json && cmp -s /tmp/keyword-registry.schema.json schema/keyword-registry.schema.json

      - name: Version contract
        run: python3 tools/check_version_contract.py
