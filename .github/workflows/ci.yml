name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*.*.*"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - ".learnings/**"
      - "benchmarks/**"
      - "LICENSE*"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - ".learnings/**"
      - "benchmarks/**"
      - "LICENSE*"
      - ".gitignore"
      - ".gitattributes"

# Anti-waste: Cancel in-progress runs when a new commit is pushed rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fast Fail: Format & Lint first (fails in seconds if styled wrong)
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Rust lint (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Test suite
      - name: Rust tests
        run: cargo test --workspace

      # Schema & Integrity contracts
      - name: Repository contracts
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Public schema drift
        run: cargo run -q -p kept-core --example export_schema > /tmp/keyword-registry.schema.json && cmp -s /tmp/keyword-registry.schema.json schema/keyword-registry.schema.json

      - name: Version contract
        run: python3 tools/check_version_contract.py
