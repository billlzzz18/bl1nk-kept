# Project-local RTK filters — commit this file with your repo.
# Filters here override user-global and built-in filters.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
schema_version = 1

# Example: suppress build noise from a custom tool
[filters.cargo-check]
description = "Mute cargo check noise for Antigravity"
# Match `cargo check` and related commands
match_command = "^\\w+cargo\\s+check\\b"

# Strip ANSI codes
strip_ansi = true

# Suppress known noisy patterns
strip_lines_matching = [
  # Progress bars
  "^\\s*\\d+/\\d+\\s+\\",
  # Package compilation output (we just care about errors)
  "^\\s*Compiling\\b",
  "^\\s*Finished\\b",
  "^\\s*Running\\b",
  "^\\s*Checking\\b",
  "^\\s*Updating\\b",
  "^\\s*Adding\\b",
  "^\\s*Resolving\\b",
  "^\\s*Documenting\\b",
  "^\\s*Blocking\\b",
  "^\\s*Blocking\\s+on\\b",
]

# Only show errors and warnings (keep important messages)
only_matching = ["error", "warning", "help", "note", "For more information on this error"]
